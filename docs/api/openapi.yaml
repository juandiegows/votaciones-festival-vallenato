      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edicion'
          description: ''
  /api/gestion/auditoria/:
    get:
      operationId: gestion_auditoria_list
      summary: Registro de acciones (50 por página)
      parameters:
      - in: query
        name: accion
        schema:
          type: string
        description: crear, actualizar, eliminar, publicar, despublicar, cerrar…
      - in: query
        name: entidad
        schema:
          type: string
        description: edicion, categoria, votacion, opcion, banner…
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Busca en el correo o nombre del usuario y en el ID de la entidad
      tags:
      - Auditoría
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRegistroAuditoriaList'
          description: ''
  /api/gestion/auditoria/{id}/:
    get:
      operationId: gestion_auditoria_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este registro de auditoría.
        required: true
      tags:
      - Auditoría
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroAuditoria'
          description: ''
  /api/gestion/auditoria/integridad/:
    get:
      operationId: gestion_auditoria_integridad_retrieve
      description: Comprueba en cada votación que la suma por opción coincida con
        el total, que nadie supere el límite de votos y que no haya votos por opciones
        ajenas o inactivas, fuera de plazo o con comprobantes repetidos.
      summary: Verificación de integridad de los votos de una edición
      parameters:
      - in: query
        name: edicion
        schema:
          type: integer
        description: ID de la edición; por defecto, la activa
      tags:
      - Auditoría
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integridad'
          description: ''
        '404':
          description: No hay edición
  /api/gestion/banners/:
    get:
      operationId: gestion_banners_list
      description: Banners del inicio por edición. La imagen se envía como multipart/form-data
        (JPG, PNG o WebP, máximo 3 MB).

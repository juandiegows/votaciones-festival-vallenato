      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionListadoPublico'
          description: ''
  /api/sitio/:
    get:
      operationId: sitio_retrieve
      summary: 'Contenido del sitio: contacto, redes, revistas y banners activos de
        la edición activa'
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sitio'
          description: ''
  /api/votaciones/:
    get:
      operationId: votaciones_list
      summary: Votaciones publicadas (RF-05)
      parameters:
      - in: query
        name: anio
        schema:
          type: integer
        description: Año de la edición
      - in: query
        name: categoria
        schema:
          type: integer
        description: ID de la categoría
      - in: query
        name: categoria_slug
        schema:
          type: string
        description: Slug de la categoría
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - abierta
          - cerrada
          - programada
      - in: query
        name: slug
        schema:
          type: string
        description: Slug de la votación
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VotacionPublica'
          description: ''
  /api/votaciones/{id}/:
    get:
      operationId: votaciones_retrieve
      summary: Detalle con opciones y votos del usuario (RF-06)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este votación.
        required: true
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotacionDetalle'
          description: ''
  /api/votaciones/{id}/resultados/:
    get:
      operationId: votaciones_resultados_retrieve
      summary: Resultados públicos según visibilidad (RF-15, RN-07)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este votación.
        required: true
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultados'
          description: ''
        '403':
          description: Aún no son públicos
  /api/votaciones/{id}/votar/:
    post:
      operationId: votaciones_votar_create
      summary: Emitir voto (RF-07, RF-08; RN-02 a RN-05)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este votación.
        required: true
      tags:
      - Votación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VotarRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VotarRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VotarRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRegla'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRegla'
          description: ''
  /api/votaciones/por-ruta/:
    get:
      operationId: votaciones_por_ruta_retrieve
      summary: Detalle por URL amigable /{año}/{categoría}/{votación} (RF-06)
      parameters:
      - in: query
        name: anio
        schema:
          type: integer
        description: Año de la edición
        required: true
      - in: query
        name: categoria
        schema:
          type: string
        description: Slug de la categoría
        required: true
      - in: query
        name: votacion
        schema:
          type: string
        description: Slug de la votación
        required: true
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotacionDetalle'
          description: ''
        '404':
          description: No existe o no está publicada
components:

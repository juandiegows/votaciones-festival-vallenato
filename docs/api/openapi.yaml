            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VotacionPublica'
          description: ''
  /api/votaciones/{id}/:
    get:
      operationId: votaciones_retrieve
      summary: Detalle con opciones y votos del usuario (RF-06)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este votación.
        required: true
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotacionDetalle'
          description: ''
  /api/votaciones/{id}/resultados/:
    get:
      operationId: votaciones_resultados_retrieve
      summary: Resultados públicos según visibilidad (RF-15, RN-07)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este votación.
        required: true
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultados'
          description: ''
        '403':
          description: Aún no son públicos
  /api/votaciones/{id}/votar/:
    post:
      operationId: votaciones_votar_create
      summary: Emitir voto (RF-07, RF-08; RN-02 a RN-05)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este votación.
        required: true
      tags:
      - Votación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VotarRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VotarRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VotarRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRegla'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRegla'
          description: ''

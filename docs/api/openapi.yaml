openapi: 3.0.3
info:
  title: API – Sistema Web de Votaciones del Festival de la Leyenda Vallenata
  version: 1.0.0
  description: 'API REST del Sistema Web de Votaciones del Festival de la Leyenda
    Vallenata (proyecto académico, Areandina – Desarrollo Web). Jerarquía: Edición
    → Categoría → Votación → Opción → Voto. Autenticación: encabezado `Authorization:
    Token <token>` obtenido en `/api/auth/login/` o `/api/auth/registro/`.'
paths:
  /api/admin/auditoria/:
    get:
      operationId: admin_auditoria_list
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      tags:
      - Auditoría
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRegistroAuditoriaList'
          description: ''
  /api/admin/auditoria/{id}/:
    get:
      operationId: admin_auditoria_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este registro de auditoría.
        required: true
      tags:
      - Auditoría
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroAuditoria'
          description: ''

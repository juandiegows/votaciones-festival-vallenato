openapi: 3.0.3
info:
  title: API – Sistema Web de Votaciones del Festival de la Leyenda Vallenata
  version: 1.0.0
  description: 'API REST del Sistema Web de Votaciones del Festival de la Leyenda
    Vallenata (proyecto académico, Areandina – Desarrollo Web). Jerarquía: Edición
    → Categoría → Votación → Opción → Voto. Autenticación: encabezado `Authorization:
    Token <token>` obtenido en `/api/auth/login/` o `/api/auth/registro/`.'
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Iniciar sesión (RF-02)
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRespuesta'
          description: ''
        '400':
          description: Credenciales incorrectas
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Cerrar sesión (invalida el token)
      tags:
      - Autenticación
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/registro/:
    post:
      operationId: auth_registro_create
      summary: Registrar votante (RF-01, RN-10)
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRespuesta'
          description: ''
        '400':
          description: Datos inválidos
  /api/auth/yo/:
    get:
      operationId: auth_yo_retrieve
      summary: Usuario autenticado
      tags:
      - Autenticación
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
  /api/categorias/:
    get:
      operationId: categorias_list
      summary: Categorías activas (RF-04)
      parameters:
      - in: query
        name: anio
        schema:
          type: integer
        description: Año de la edición (URL amigable /{año})
      - in: query
        name: edicion
        schema:
          type: integer
        description: ID de la edición; por defecto, la edición activa
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
          description: ''
  /api/categorias/{id}/:
    get:
      operationId: categorias_retrieve
      summary: Detalle de categoría
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este categoría.
        required: true
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
  /api/ediciones/:
    get:
      operationId: ediciones_list
      summary: Listar ediciones
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Edicion'
          description: ''
  /api/ediciones/{id}/:
    get:
      operationId: ediciones_retrieve
      summary: Detalle de edición
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este edición.
        required: true
      tags:
      - Consulta pública
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edicion'
          description: ''
  /api/ediciones/vigente/:
    get:
      operationId: ediciones_vigente_retrieve
      tags:
      - Consulta pública
      security:

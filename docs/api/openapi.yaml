components:
  schemas:
    BannerInicio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 120
        subtitulo:
          type: string
          maxLength: 250
        imagen:
          type: string
          format: uri
        texto_alternativo:
          type: string
          description: Descripción de la imagen para lectores de pantalla.
          maxLength: 200
        texto_boton:
          type: string
          maxLength: 40
        enlace_boton:
          type: string
          description: Ruta del sitio (/2027) o URL http(s).
          maxLength: 300
        orden:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        activo:
          type: boolean
      required:
      - id
      - imagen
      - texto_alternativo
      - titulo
    BannerInicioRequest:
      type: object
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        subtitulo:
          type: string
          maxLength: 250
        imagen:
          type: string
          format: binary
        texto_alternativo:
          type: string
          minLength: 1
          description: Descripción de la imagen para lectores de pantalla.
          maxLength: 200
        texto_boton:
          type: string
          maxLength: 40
        enlace_boton:
          type: string
          description: Ruta del sitio (/2027) o URL http(s).
          maxLength: 300
        orden:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        activo:
          type: boolean
      required:
      - imagen
      - texto_alternativo
      - titulo
    Categoria:
      type: object
      description: El slug es opcional (se genera desde el nombre o título), así que
        su unicidad se valida aparte.
      properties:
        id:
          type: integer
          readOnly: true
        edicion:
          type: integer
        edicion_anio:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 120
        slug:
          description: Identificador para la URL pública; se genera desde el nombre
            si se deja vacío.
          oneOf:
          - type: string
            maxLength: 120
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        descripcion:
          type: string
        icono:
          type: string
          maxLength: 60
        activa:
          type: boolean
        orden:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - edicion
      - edicion_anio
      - id
      - nombre
    CategoriaRequest:
      type: object
      description: El slug es opcional (se genera desde el nombre o título), así que
        su unicidad se valida aparte.
      properties:
        edicion:
          type: integer
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          description: Identificador para la URL pública; se genera desde el nombre
            si se deja vacío.
          oneOf:
          - type: string
            maxLength: 120
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        descripcion:
          type: string
        icono:
          type: string
          maxLength: 60
        activa:
          type: boolean
        orden:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - edicion
      - nombre
    ConfiguracionSitio:
      type: object
      properties:
        nombre_organizacion:
          type: string
          maxLength: 150
        telefono:
          type: string
          maxLength: 40
        direccion:
          type: string
          maxLength: 200
        correo:
          type: string
          format: email
          maxLength: 254
        texto_pie:
          type: string
    ConfiguracionSitioRequest:
      type: object
      properties:
        nombre_organizacion:
          type: string
          minLength: 1
          maxLength: 150
        telefono:
          type: string
          minLength: 1
          maxLength: 40
        direccion:
          type: string
          minLength: 1
          maxLength: 200
        correo:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        texto_pie:
          type: string
    Edicion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 150
        anio:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Año
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EdicionEstadoEnum'
      required:
      - anio
      - fecha_fin
      - fecha_inicio
      - id
      - nombre
    EdicionEstadoEnum:
      enum:
      - activa
      - cerrada
      type: string
      description: |-
        * `activa` - Activa
        * `cerrada` - Cerrada
    EdicionRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        anio:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Año
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EdicionEstadoEnum'
      required:
      - anio
      - fecha_fin
      - fecha_inicio
      - nombre
    ErrorRegla:
      type: object
      properties:
        detail:
          type: string
          description: Mensaje legible; cita la regla de negocio (RN-xx).
        codigo:
          type: string
          description: votacion_no_abierta · opcion_invalida · limite_votos · opciones_insuficientes
            · tiene_votos · registros_asociados
      required:
      - codigo
      - detail
    FilaResultado:
      type: object
      properties:
        opcion_id:
          type: integer
        opcion:
          type: string
        votos:
          type: integer
        porcentaje:
          type: number
          format: double
      required:
      - opcion
      - opcion_id
      - porcentaje
      - votos
    IconoEnum:
      enum:
      - facebook
      - twitter-x
      - instagram
      - youtube
      - tiktok
      - whatsapp
      - spotify
      - globe
      type: string
      description: |-
        * `facebook` - Facebook
        * `twitter-x` - X
        * `instagram` - Instagram
        * `youtube` - YouTube
        * `tiktok` - TikTok
        * `whatsapp` - WhatsApp
        * `spotify` - Spotify
        * `globe` - Sitio web
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email

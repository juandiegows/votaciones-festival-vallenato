# Cabeceras de seguridad comunes. Se incluye en cada «location» porque nginx no hereda add_header del server
# cuando la location declara los suyos. Equivalente Apache: public/.htaccess.
# En la VPS el edge (vps-infra) ya agrega HSTS y repite estas con los mismos valores (sin conflicto al duplicarse);
# la CSP y COOP solo las pone este contenedor.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# connect-src: la API en el mismo dominio (VPS) o en localhost:8096 (Docker local)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:8096; media-src 'self' blob: https: http://localhost:8096; connect-src 'self' https://votaciones.juandiegows.com http://localhost:8096; frame-src https://www.youtube-nocookie.com https://open.spotify.com https://w.soundcloud.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

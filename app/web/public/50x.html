<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#FCE6CC;color:#555;font-family:Poppins,system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
.caja{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr);width:100%;max-width:52rem;background:#fff;border:1px solid #E9E9E9;border-radius:.75rem;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.codigo{background:linear-gradient(135deg,#000 0%,#2A0B08 55%,#7D2710 100%);color:#D7AC70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;text-align:center}
.numero{font-family:Raleway,Poppins,system-ui,sans-serif;font-weight:800;font-size:5rem;line-height:1}.etiqueta{color:#E9D294;text-transform:uppercase;letter-spacing:.2em;font-size:.75rem;font-weight:600}
.texto{padding:2rem}.marca{color:#B71C1C;font-size:.8rem;font-weight:600;text-transform:uppercase;margin:0 0 .25rem}
h1{color:#000;font-family:Raleway,Poppins,system-ui,sans-serif;font-weight:800;font-size:1.6rem;margin:0 0 .5rem}ul{padding-left:1.1rem;font-size:.9rem}
.acciones{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem}.btn{display:inline-block;padding:.55rem 1rem;border-radius:.5rem;font-weight:600;text-decoration:none;border:1px solid #DD3333;font-size:.95rem;cursor:pointer;font-family:inherit}
.primario{background:#DD3333;color:#fff}.primario:hover{background:#B71C1C;border-color:#B71C1C}.secundario{background:transparent;color:#B71C1C}.secundario:hover{background:#DD3333;color:#fff}
.btn:focus-visible{outline:3px solid rgba(221,51,51,.45);outline-offset:2px}
@media (max-width:575.98px){.caja{grid-template-columns:1fr}.codigo{flex-direction:row;gap:.75rem;padding:1.25rem}.numero{font-size:3rem}.texto{padding:1.5rem}}.acordeon-animado { width: 100%; max-width: 11rem; height: auto; overflow: visible; }.acordeon-animado .acordeon-fuelle { transform-box: fill-box; transform-origin: center; animation: fuelle 1.4s ease-in-out infinite alternate; }.acordeon-animado .acordeon-pitos { animation: pitos 1.4s ease-in-out infinite alternate; }.acordeon-animado .acordeon-bajos { animation: bajos 1.4s ease-in-out infinite alternate; }.acordeon-animado .acordeon-notas text { opacity: 0; transform-box: fill-box; animation: nota 2.4s ease-out infinite; }.acordeon-animado .acordeon-notas text:nth-child(2) { animation-delay: .8s; }.acordeon-animado .acordeon-notas text:nth-child(3) { animation-delay: 1.6s; }@keyframes fuelle { from { transform: scaleX(1.06); } to { transform: scaleX(.72); } }@keyframes pitos { from { transform: translateX(-2px); } to { transform: translateX(10px); } }@keyframes bajos { from { transform: translateX(2px); } to { transform: translateX(-10px); } }@keyframes nota { 0% { opacity: 0; transform: translate(0, 10px) rotate(-8deg); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -18px) rotate(10deg); } }@media (prefers-reduced-motion: reduce) {  .acordeon-animado * { animation: none !important; }  .acordeon-animado .acordeon-notas text { opacity: 1; }}@media (max-width:575.98px){.acordeon-animado{max-width:6.5rem}}</style>
</head>
<body>
<main class="caja" aria-labelledby="titulo">

128" cy="50" r="2.8" fill="#D7AC70"/><circle cx="138" cy="50" r="2.8" fill="#D7AC70"/><circle cx="128" cy="62" r="2.8" fill="#D7AC70"/><circle cx="138" cy="62" r="2.8" fill="#D7AC70"/><rect x="124" y="70" width="18" height="4" rx="2" fill="#D7AC70"/></g></svg><div><span class="numero" style="display:block">503</span><span class="etiqueta">Error</span></div></div>

</html>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Página de error propia si nginx falla (las rutas inexistentes las resuelve la SPA con su 404)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Assets con hash de Vite: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # Worker de pdf.js (.mjs): debe llegar como JavaScript o el navegador no lo ejecuta
        location ~ \.mjs$ {
            default_type text/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # SPA (BrowserRouter): todo lo demás cae en index.html, sin caché
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/wasm application/xml image/svg+xml;

    # Página de error propia si nginx falla (las rutas inexistentes las resuelve la SPA con su 404)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        include snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
    }

    # Archivos ocultos (.htaccess, .git…): 404, salvo /.well-known/ (security.txt)
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        include snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # robots.txt, humans.txt y manifiesto: caché corta (cambian sin hash en el nombre)
    location ~ ^/(robots|humans)\.txt$ {
        default_type text/plain;
        include snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        include snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # Assets con hash de Vite: caché larga
    location /assets/ {
        expires 1y;
        include snippets/seguridad.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;

        # Worker de pdf.js (.mjs): debe llegar como JavaScript o el navegador no lo ejecuta
        location ~ \.mjs$ {
            default_type text/javascript;
            expires 1y;
            include snippets/seguridad.conf;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # Páginas privadas (cuenta, comprobantes, panel, errores): fuera de los buscadores
    location ~ ^/(login|mis-votos|confirmar-correo|panel|error)(/|$)|/comprobante$ {
        include snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # SPA (BrowserRouter): todo lo demás cae en index.html, sin caché
    location / {
        include snippets/seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

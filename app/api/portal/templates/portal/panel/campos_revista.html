{% load portal %}
<div class="mb-3">
  <label class="form-label" for="id_archivo">Archivo PDF{% if not instancia %} <span class="text-danger" aria-hidden="true">*</span>{% endif %} <span class="fw-normal text-secondary-flv">(máximo 50 MB{% if instancia %}; déjalo vacío para conservar el actual{% endif %})</span></label>
  <input id="id_archivo" name="archivo" type="file" accept="application/pdf,.pdf" class="form-control{{ form.archivo|campo_invalido }}"{% if form.archivo.errors %} aria-invalid="true"{% endif %}>
  {% if form.archivo.errors %}<div class="invalid-feedback">{{ form.archivo.errors|join:" " }}</div>{% endif %}
  {% if instancia and instancia.archivo %}<div class="form-text"><a href="{{ instancia.archivo.url }}" target="_blank" rel="noopener noreferrer"><i class="bi bi-file-earmark-pdf me-1" aria-hidden="true"></i>Ver el PDF actual</a></div>{% endif %}
</div>
{% include "portal/parciales/campo.html" with campo=form.titulo %}
<div class="mb-3">
  <label class="form-label" for="id_descripcion">Descripción <span class="fw-normal text-secondary-flv">(opcional)</span></label>
  <textarea id="id_descripcion" name="descripcion" rows="2" class="form-control">{{ form.descripcion.value|default_if_none:'' }}</textarea>
</div>
<div class="form-check form-switch">
  <input id="id_activa" name="activa" class="form-check-input" type="checkbox" role="switch"{% if form.activa.value %} checked{% endif %}>
  <label class="form-check-label" for="id_activa">Mostrar en el inicio</label>
</div>

name: Imagen Docker de la web (VPS)

on:
  push:
    branches: [main]
    paths:
      - "app/web/**"
      - ".github/workflows/docker-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app/web
          push: true
          tags: |
            ghcr.io/juandiegows/votaciones-festival-vallenato-web:latest
            ghcr.io/juandiegows/votaciones-festival-vallenato-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
